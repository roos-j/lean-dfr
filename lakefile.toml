name = "lean-dfr"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DFR"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "lean_spherical"
git = "https://github.com/roos-j/lean-spherical.git"
rev = "2b0e2bbf35cdf45ab99d1d77b2dea37b214fe236"

[[lean_lib]]
name = "DFR"
